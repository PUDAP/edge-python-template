services:
  edge:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/pudap/${MACHINE_ID}-edge:latest
    container_name: ${MACHINE_ID}-edge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PUDA_NATS_CA: "${PUDA_NATS_CA:+/run/puda-ca/ca.pem}"
      PUDA_E2E_KEY_FILE: "${PUDA_E2E_KEY_FILE:+/run/puda-key/e2e.key}"
    volumes:
      # Empty settings use unused placeholders; no host secrets are required.
      - type: bind
        source: ${PUDA_NATS_CA:-/dev/null}
        target: /run/puda-ca/ca.pem
        read_only: true
        bind:
          create_host_path: false
      # Writable so SDK key rotations persist to the host file.
      - type: bind
        source: ${PUDA_E2E_KEY_FILE:-/dev/null}
        target: /run/puda-key/e2e.key
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
